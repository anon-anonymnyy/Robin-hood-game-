name: Сборка Android APK

# Запускается сам при каждой загрузке файлов в ветку main (или master),
# а также вручную: вкладка Actions → "Сборка Android APK" → Run workflow.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.4.1"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Забираем файлы проекта
        uses: actions/checkout@v4

      - name: Ставим Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ставим системные библиотеки для Godot
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1 libgl1 libx11-6 libxcursor1 libxi6 libxinerama1 libxrandr2

      - name: Скачиваем Godot и шаблоны экспорта
        run: |
          set -e
          cd "$RUNNER_TEMP"
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates"
          unzip -q templates.tpz -d tpz
          mv tpz/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          godot --version

      - name: Проверяем Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "build-tools;35.0.1" "platforms;android-34" "platforms;android-35" || echo "sdkmanager не смог доустановить компоненты, пробуем с теми, что уже есть"
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms"

      - name: Прописываем пути Android в настройках Godot
        run: |
          set -e
          mkdir -p "$HOME/.config/godot"
          for f in editor_settings-4.tres editor_settings-4.4.tres; do
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/java_sdk_path = "%s"\nexport/android/android_sdk_path = "%s"\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.config/godot/$f"
          done

      - name: Готовим ключ подписи (если debug.keystore не загружен)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -keystore debug.keystore -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -storetype PKCS12
          fi

      - name: Номер версии = номер сборки (чтобы APK ставился поверх старого)
        run: |
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"0.${{ github.run_number }}\"/" export_presets.cfg
          grep -n "^version" export_presets.cfg

      - name: "Собираем APK (релизная версия, быстрее отладочной)"
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          set -e
          mkdir -p build
          godot --headless --path . --import || true
          godot --headless --path . --export-release "Android" build/RobinHood.apk
          ls -la build
          test -s build/RobinHood.apk

      - name: Сохраняем APK в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: RobinHood-apk
          path: build/RobinHood.apk

      - name: Публикуем APK в разделе Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" build/RobinHood.apk --title "Сборка ${{ github.run_number }}" --notes "Тестовая сборка ${{ github.run_number }}" --latest --target "${{ github.sha }}"
